<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نهال اکسسوری | NAHAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7f4ee; --paper:#fffcf7; --blush:#eedcd5; --teal:#005a63; --teal-deep:#004850;
  --pink:#f78ce8; --ink:#1c1c1e; --muted:#8b8b8b; --leaf:#4f8d58; --gold:#c9962f; --line:#ece6dd;
  --f-display:'Playfair Display',Georgia,serif; --f-script:'Outfit',sans-serif; --f-body:'Vazirmatn','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#fit{position:relative;height:100%;width:100%}
#stage{position:absolute;left:50%;top:50%;width:1200px;height:690px;transform-origin:50% 50%;
  background:
   radial-gradient(520px 380px at 18% 20%,rgba(238,220,213,.55),transparent 70%),
   radial-gradient(560px 420px at 86% 78%,rgba(214,232,190,.45),transparent 70%),
   radial-gradient(700px 500px at 55% 30%,rgba(255,252,243,.9),transparent 70%),var(--cream);
  border-radius:26px;overflow:hidden}
.caps{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.disp{font-family:var(--f-display);font-weight:600;color:var(--teal)}
.glass{background:rgba(255,252,247,.82);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,90,99,.12)}
.card{background:linear-gradient(180deg,#fffcf7,#fdf8ee);border-radius:20px;box-shadow:0 12px 32px rgba(0,90,99,.14),inset 0 0 0 1px rgba(255,255,255,.8)}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:76px;z-index:20}
.logo{position:absolute;right:62px;top:16px;display:flex;gap:10px;align-items:center;cursor:pointer}
.logo .name{font-family:var(--f-script);font-size:26px;line-height:1;color:var(--ink);position:relative;font-weight:800;letter-spacing:.1em}
.logo .sub{display:block;font-family:var(--f-body);font-size:8px;letter-spacing:.24em;color:var(--muted);margin-top:5px;font-weight:500}
.nav{position:absolute;left:0;right:0;top:22px;display:flex;justify-content:center;gap:34px;padding-left:20px}
.nav button{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--ink);padding:6px 2px;position:relative;font-family:var(--f-body)}
.nav button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--teal);transform:scaleX(0);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.nav button:hover::after,.nav button.on::after{transform:scaleX(1)}
.nav button.on{color:var(--teal)}
.tools{position:absolute;left:38px;top:18px;display:flex;gap:12px;align-items:center}
.pillc{height:32px;border-radius:999px;display:flex;align-items:center;gap:7px;padding:0 12px 0 10px;font-size:12px;font-weight:500;cursor:pointer;transition:transform .2s}
.pillc:hover{transform:translateY(-1px)}
.pillc .plus{width:13px;height:13px;border-radius:50%;background:var(--teal);color:#fff;font-size:9px;display:grid;place-items:center;line-height:1}

/* dock */
.dock{position:absolute;left:30px;right:30px;bottom:14px;height:48px;border-radius:16px;z-index:20;display:flex;align-items:center;padding:0 22px}
.dock .l{display:flex;gap:9px;align-items:center;width:250px}
.dock .l b{display:block;font-family:var(--f-script);font-weight:600;font-size:18px;line-height:1;letter-spacing:.1em}
.dock .l small{display:block;font-size:7px;letter-spacing:.22em;color:var(--muted);margin-top:3px}
.dock .tag{flex:1;text-align:center;font-family:var(--f-body);font-size:13px;color:var(--ink);font-weight:500}
.dock .open{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:26px;font-weight:500}
.dock .open::before{content:"";width:7px;height:7px;border-radius:50%;background:#6fb36d;box-shadow:0 0 0 4px rgba(111,179,109,.2);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(111,179,109,0)}}
.dock .icons{display:flex;gap:6px}
.dock .icons button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--ink);transition:transform .25s,color .25s,background .25s}
.dock .icons button:hover{transform:translateY(-2px)}
.dock .icons button.on{color:var(--teal);background:rgba(0,90,99,.09)}
.badge{position:absolute;right:-1px;top:-1px;min-width:15px;height:15px;border-radius:9px;background:var(--teal);color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;padding:0 3px;line-height:1}
.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{30%{transform:scale(1.35) rotate(-8deg)}100%{transform:none}}

/* building */
.bld{position:absolute;left:0;top:0;width:520px;height:720px;transform-origin:0 0;pointer-events:none;z-index:5;
  transition:transform 1.05s cubic-bezier(.65,0,.25,1);transform:translate(350px,44px) scale(.8);--mx:0;--my:0}
#stage[data-page=menu] .bld{transform:translate(-14px,338px) scale(.4)}
#stage[data-page=bag] .bld{transform:translate(-14px,338px) scale(.4)}
#stage[data-page=thanks] .bld{transform:translate(-14px,338px) scale(.4)}
.bld img{width:100%;height:100%;object-fit:cover;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.bob{animation:bob 4.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* petals */
.petals{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.petal{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}8%{opacity:.85}50%{transform:translate(40px,340px) rotate(200deg)}100%{transform:translate(-30px,740px) rotate(420deg);opacity:.2}}
.calm .petals{display:none}

/* layers */
.layer{position:absolute;z-index:10;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s .3s}
.layer.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease .05s}
.layer.on .rise{animation:rise .75s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0)*70ms + 260ms)}
.layer.on .rise-l{animation:riseL .8s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0)*90ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes riseL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.noanim .rise,.noanim .rise-l{animation:none!important}

/* left column */
.L-left{right:0;top:84px;width:350px;height:540px}
.hello{position:absolute;right:78px;top:6px;line-height:.92;text-align:right}
.hello span{display:block;font-family:var(--f-body);font-size:36px;font-weight:900;color:var(--ink);white-space:nowrap}
.hello span:nth-child(2){color:var(--teal);margin-right:34px}
.trio{position:absolute;right:78px;top:120px;display:flex;gap:12px;font-size:10px;letter-spacing:.2em;color:var(--muted);white-space:nowrap;font-weight:500}
.trio i{font-style:normal;color:var(--teal)}
.side{position:absolute;right:78px;top:160px;width:190px;display:flex;flex-direction:column;gap:6px}
.side button{height:34px;border-radius:12px;background:rgba(255,252,247,.92);box-shadow:0 6px 14px rgba(0,90,99,.1),inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:10px;letter-spacing:.1em;font-weight:600;color:var(--ink);transition:transform .25s,box-shadow .25s,background .25s;position:relative}
.side button:hover{transform:translateX(-4px)}
.side button .chev{margin-right:auto;opacity:.45;font-size:13px;letter-spacing:0}
.side button.on{background:linear-gradient(180deg,var(--teal),var(--teal-deep));color:#fff;box-shadow:0 8px 18px rgba(0,90,99,.35)}
.side button.on .chev{opacity:.9}

/* home right */
.R-home{left:758px;top:90px;width:398px;height:524px;display:flex;flex-direction:column;gap:14px}
.special{height:176px;position:relative;overflow:hidden;background:linear-gradient(110deg,#eaf5f4,#fdf6ec 55%,#fceceb)}
.special .eyebrow{position:absolute;right:30px;top:22px}
.special h2{position:absolute;right:28px;top:40px;margin:0;font-size:28px;line-height:1.1;font-weight:800;color:var(--ink)}
.special h2 i{font-size:12px;vertical-align:baseline;margin-right:2px;color:var(--teal)}
.special .sub{position:absolute;right:30px;top:100px;font-size:8.5px;line-height:1.7;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;font-weight:500}
.special .art{position:absolute;left:-6px;top:6px;width:190px;height:160px;border-radius:50%;overflow:hidden;transform:rotate(-5deg);border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.special .art img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,var(--teal),var(--teal-deep));color:#fff;font-size:9.5px;letter-spacing:.1em;font-weight:600;box-shadow:0 8px 16px rgba(0,90,99,.32);transition:transform .22s,box-shadow .22s,background .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 20px rgba(0,90,99,.38)}
.btn:active{transform:translateY(0) scale(.97)}
.special .btn{position:absolute;right:28px;top:138px;height:26px;padding:0 15px;font-size:8.5px}
.sect{padding:14px 16px 12px;position:relative}
.sect .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sect .hd b{font-size:9.5px;letter-spacing:.18em;font-weight:600}
.sect .hd a{margin-right:auto;font-size:9px;letter-spacing:.16em;font-weight:600;cursor:pointer;color:var(--ink)}
.sect .hd a:hover{color:var(--teal)}
.best{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bi{text-align:center;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.bi:hover{transform:translateY(-5px)}
.bi .tile{height:58px;border-radius:12px;background:#f5e7d3;display:grid;place-items:center;overflow:hidden}
.bi .tile img{width:100%;height:100%;object-fit:cover}
.bi b{display:block;font-family:var(--f-display);font-weight:500;font-size:10.5px;margin-top:7px}
.bi span{display:block;font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.06em}

/* menu page */
.P-menu{inset:0}
.mtitle{position:absolute;right:68px;top:90px;width:300px;text-align:right}
.mtitle h1{margin:20px 0 4px;font-size:48px;line-height:1;font-weight:900;color:var(--ink)}
.mpanel{position:absolute;right:360px;top:88px;width:794px;height:528px;overflow:hidden}
.mview{position:absolute;inset:0;transition:opacity .45s ease,transform .6s cubic-bezier(.22,.9,.3,1)}
.mview.hide{opacity:0;pointer-events:none;transform:scale(.96)}
#mDetail.hide{transform:scale(1.03)}
.mhead{display:flex;align-items:center;padding:20px 24px 12px}
.mhead b{font-size:9.5px;letter-spacing:.18em;font-weight:600;margin-right:8px}
.pills{margin-right:auto;display:flex;gap:6px}
.pills button{height:24px;padding:0 12px;border-radius:999px;background:rgba(255,252,247,.9);box-shadow:inset 0 0 0 1px var(--line);font-size:9px;letter-spacing:.1em;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .25s}
.pills button:hover{box-shadow:inset 0 0 0 1px var(--teal)}
.pills button.on{background:var(--teal);color:#fff;box-shadow:0 4px 10px rgba(0,90,99,.3)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:4px 24px 24px}
.pc{background:linear-gradient(180deg,#fffcf7,#fdf8ee);border-radius:14px;padding:10px 10px 12px;box-shadow:0 6px 18px rgba(0,90,99,.12),inset 0 0 0 1px var(--line);cursor:pointer;text-align:center;position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
.pc:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 28px rgba(0,90,99,.22)}
.pc .tile{height:118px;border-radius:10px;background:#f0f0f0;display:grid;place-items:center;overflow:hidden}
.pc .tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.pc:hover .tile img{transform:scale(1.1) rotate(-2deg)}
.pc h3{margin:10px 0 3px;font-weight:600;font-size:12px}
.pc .s{font-size:8px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.pc .row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:12px;padding:0 2px;font-weight:700}
.addq{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 8px rgba(0,90,99,.3);transition:transform .25s}
.addq:hover{transform:scale(1.2) rotate(90deg)}
.addq.ok{background:var(--leaf);transform:scale(1.15)}
.fade-in{animation:rise .6s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}

/* detail */
.dstage{position:absolute;right:30px;top:70px;width:410px;height:300px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none}
.dstage:active{cursor:grabbing}
.dart{width:320px;height:320px;border-radius:50%;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);will-change:transform;transition:filter .3s;border:6px solid #fff}
.dart img{width:100%;height:100%;object-fit:cover}
.dinfo{position:absolute;right:468px;top:108px;width:290px;text-align:right}
.dinfo h2{margin:6px 0 8px;font-size:26px;line-height:1.1;font-weight:800;color:var(--ink)}
.dinfo .price{font-size:16px;margin-bottom:12px;display:inline-block;font-weight:700;color:var(--teal)}
.dinfo p{margin:0 0 14px;font-size:12px;line-height:1.6;color:#666}
.opts{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.opts button{height:26px;padding:0 12px;border-radius:8px;background:rgba(255,252,247,.9);box-shadow:inset 0 0 0 1px var(--line);font-size:10px;font-weight:600;transition:all .25s}
.opts button.on{background:#e8f2f1;box-shadow:inset 0 0 0 1.5px var(--teal);color:var(--teal)}
.buy{display:flex;gap:12px;align-items:center}
.stepper{display:flex;align-items:center;height:28px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,252,247,.9)}
.stepper button{width:26px;height:26px;font-size:14px;color:var(--ink);border-radius:50%}
.stepper span{min-width:20px;text-align:center;font-size:11px;font-weight:600}
.buy .btn{height:30px}
.strip{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid rgba(235,214,190,.7);display:flex;justify-content:center;align-items:center;gap:8px}
.th{width:46px;height:46px;border-radius:12px;background:#f3e3cc;display:grid;place-items:center;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;box-shadow:inset 0 0 0 1px #ecd8bd;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th.on{box-shadow:inset 0 0 0 2px var(--teal),0 6px 12px rgba(0,90,99,.25);background:#e8f2f1;transform:translateY(-3px) scale(1.08)}
.hint{position:absolute;right:0;width:480px;bottom:90px;text-align:center;font-family:var(--f-body);font-size:12px;color:var(--muted)}

/* bag */
.R-bag,.R-thanks{left:758px;top:88px;width:398px;height:528px}
.bagp{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 18px 18px;background:linear-gradient(180deg,#fdf8ee,#fcf3e6 28%,#fcf3e6)}
.bagp h2{margin:6px 0 0;font-family:var(--f-body);font-weight:900;font-size:22px;line-height:1.2}
.rows{flex:1;overflow-y:auto;margin:12px -6px 0;padding:2px 6px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.brow{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:12px;background:rgba(255,252,247,.95);box-shadow:0 4px 12px rgba(0,90,99,.1),inset 0 0 0 1px var(--line);min-height:50px;transition:opacity .25s,transform .25s}
.brow.out{opacity:0;transform:translateX(30px)}
.brow .t{width:36px;height:36px;border-radius:10px;background:#f6e4cf;display:grid;place-items:center;flex:none;overflow:hidden}
.brow .t img{width:100%;height:100%;object-fit:cover}
.brow .n{flex:1;min-width:0;text-align:right}
.brow .n b{display:block;font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .n small{display:block;font-size:8px;letter-spacing:.1em;color:var(--muted);margin-top:3px;font-weight:500}
.brow .stepper{height:22px}
.brow .stepper button{width:20px;height:20px;font-size:12px}
.brow .stepper span{font-size:10px;min-width:16px}
.brow .pr{width:56px;text-align:left;font-size:11px;font-weight:700}
.brow .x{width:16px;font-size:12px;color:#b99}
.brow .x:hover{color:var(--teal)}
.tot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tot small{font-size:8.5px;letter-spacing:.2em;font-weight:600;display:block}
.tot b{font-family:var(--f-body);font-weight:900;font-size:22px;color:var(--teal);line-height:1}
.tot .btn{height:34px;padding:0 18px;font-size:9px}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--f-body);font-size:16px}

/* thanks */
.thanks{position:absolute;inset:0;padding:30px 36px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;background:linear-gradient(180deg,#fdf8ee,#fcf3e6 30%,#fcf3e6)}
.thanks .tick{width:40px;height:40px;border-radius:50%;background:#e8f3e4;display:grid;place-items:center;margin-bottom:4px}
.thanks h2{margin:0;font-family:var(--f-body);font-weight:900;font-size:28px;line-height:1.2;color:var(--teal)}
.thanks .lead{font-size:11px;color:#6a4b45;line-height:1.5;margin:4px 0 14px}
.receipt{width:100%;text-align:right;padding:14px 16px;background:#fffdf8;border-radius:6px;box-shadow:0 8px 20px rgba(150,100,80,.14);position:relative;font-size:10.5px}
.receipt .id{font-size:8px;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px dashed #e7d3bd;margin-bottom:8px;font-weight:500}
.receipt .li{display:flex;justify-content:space-between;padding:2.5px 0}
.receipt .tt{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed #e7d3bd;margin-top:8px;padding-top:8px;font-size:8px;letter-spacing:.2em;font-weight:600}
.receipt .tt b{font-family:var(--f-body);font-weight:900;font-size:20px;letter-spacing:0;color:var(--teal)}
.thanks .btn{margin-top:auto}

/* toast */
#toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,16px);background:rgba(28,28,30,.92);color:#fff;font-size:11px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.4,.5,1);z-index:80;letter-spacing:.04em;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.burst{position:absolute;pointer-events:none;z-index:70;font-size:14px;color:var(--teal);animation:burst 1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}

#scroller{display:contents}

/* ---------- phone layout ---------- */
@media (max-width:820px){
  #stage{position:relative;left:auto;top:auto;height:100%;transform:none!important;border-radius:0;
    margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));width:calc(100% + max(16px,env(safe-area-inset-right,0px)) + max(16px,env(safe-area-inset-left,0px)))}
  #fit{overflow:visible}
  .top{height:92px;background:linear-gradient(var(--cream) 78%,rgba(247,244,238,0))}
  .logo{right:max(16px,env(safe-area-inset-right,0px));top:9px;gap:7px}
  .logo .name{font-size:22px}
  .logo .sub{display:none}
  .tools{left:max(16px,env(safe-area-inset-left,0px));top:11px;gap:6px}

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const stage = $('#stage'), scroller = $('#scroller');
const money = n => n.toLocaleString('fa-IR') + ' تومان';
const img = id => './' + id + '.jpg';

const MENU = [
  { id: 'p1', cat: 'earrings', name: 'حلقه طلایی', desc: 'دست‌ساز با مهره‌های سیاه.', opts: [['تک', 320000], ['جفت', 600000]], def: 0 },
  { id: 'p2', cat: 'earrings', name: 'پاپیون کریستال', desc: 'پاپیون مشکی درخشان.', opts: [['جفت', 280000]], def: 0 },
  { id: 'p3', cat: 'earrings', name: 'قلب سنگ‌نشان', desc: 'قلب ظریف با سنگ.', opts: [['نقره', 340000], ['طلا', 360000]], def: 0 },
  { id: 'p4', cat: 'earrings', name: 'حلقه دوتایی', desc: 'حلقه دوتایی نقره.', opts: [['جفت', 380000]], def: 0 },
  { id: 'p5', cat: 'earrings', name: 'حلقه کریستال', desc: 'سنگ‌های ریز درخشان.', opts: [['جفت', 350000]], def: 0 },
  { id: 'p6', cat: 'necklace', name: 'ست پروانه', desc: 'ست ۴ تکه.', opts: [['کامل', 580000]], def: 0 },
  { id: 'p7', cat: 'earrings', name: 'آویز رنگی', desc: 'صورتی و نارنجی.', opts: [['جفت', 420000]], def: 0 },
  { id: 'p8', cat: 'necklace', name: 'آویز آمیتیست', desc: 'سنگ بنفش.', opts: [['گردنبند', 450000]], def: 0 },
  { id: 'p9', cat: 'earrings', name: 'مروارید', desc: 'مروارید و سنگ سبز.', opts: [['جفت', 460000]], def: 0 },
  { id: 'p10', cat: 'necklace', name: 'پروانه طلایی', desc: 'نگین سبز.', opts: [['گردنبند', 390000]], def: 0 },
  { id: 'p11', cat: 'earrings', name: 'پاپیون بلند', desc: 'مشکی بلند.', opts: [['جفت', 290000]], def: 0 },
  { id: 'p12', cat: 'earrings', name: 'منگوله قرمز', desc: 'نخ قرمز.', opts: [['جفت', 320000]], def: 0 }
];
const byId = id => MENU.find(p => p.id === id);

const S = {
  page: 'home', filter: 'all', sel: null, optI: 0, qty: 1,
  cart: [], berries: 1250, order: null
};

let scale = 1;
const mq = matchMedia('(max-width: 820px)');
const isM = () => mq.matches;
function fit() {
  const f = $('#fit');
  if (isM()) { scale = 1; stage.style.transform = ''; }
  else { scale = Math.min(f.clientWidth / 1200, f.clientHeight / 690); stage.style.transform = `translate(-50%,-50%) scale(${scale})`; }
}
new ResizeObserver(fit).observe($('#fit')); mq.addEventListener('change', fit);

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function sRect(el) { const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: (r.left - s.left)/scale, y: (r.top - s.top)/scale, w: r.width/scale, h: r.height/scale }; }
function burst(x, y, sym='✦', n=8) {
  for(let i=0; i<n; i++) {
    const e = document.createElement('span'); e.className='burst'; e.textContent=sym;
    e.style.left = x+'px'; e.style.top = y+'px';
    e.style.setProperty('--dx', (Math.random()*90-45)+'px');
    e.style.setProperty('--dy', (-30-Math.random()*70)+'px');
    e.style.setProperty('--r', (Math.random()*60-30)+'deg');
    stage.appendChild(e); setTimeout(()=>e.remove(), 1000);
  }
}
function burstAt(el, sym) { const r = sRect(el); burst(r.x+r.w/2, r.y+r.h/2, sym); }
const bump = el => { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); };
const cartCount = () => S.cart.reduce((n,i)=>n+i.q, 0);
const cartTotal = () => S.cart.reduce((n,i)=>n+byId(i.id).opts[i.o][1]*i.q, 0);
function updateBadge() { const b = $('#bagBadge'); b.textContent = cartCount().toLocaleString('fa-IR'); b.hidden = cartCount()===0; }

function renderSide() {
  const NAV = [['home','خانه'], ['menu','فروشگاه'], ['bag','سبد خرید']];
  $('#side').innerHTML = NAV.map(([k,l], i) => `<button class="rise-l" style="--i:${i+3}" data-go="${k}" class="${S.page===k?'on':''}">${l}<span class="chev">‹</span></button>`).join('');
}

function renderHome() {
  const best = MENU.slice(0,4);
  $('#rHome').innerHTML = `
  <div class="card special rise" style="--i:0">
    <div class="caps eyebrow">✦ کالکشن جدید</div>
    <h2>لحظه‌های<br>خاص <i>♥</i></h2>
    <div class="sub">دست‌ساز<br>با عشق</div>
    <button class="btn" data-go="menu">فروشگاه ←</button>
    <div class="art"><img src="${img('necklace')}" alt="" onerror="this.src='https://via.placeholder.com/190x160?text=necklace'"></div>
  </div>
  <div class="card sect rise" style="--i:1">
    <div class="hd"><b>پرفروش‌ها</b><a data-go="menu">همه ←</a></div>
    <div class="best">${best.map(p=>`<div class="bi" data-open="${p.id}"><div class="tile"><img src="${img(p.id)}" onerror="this.src='https://via.placeholder.com/58?text=${p.id}'"></div><b>${p.name}</b><span>${money(p.opts[p.def][1]).split(' ')[0]}</span></div>`).join('')}</div>
  </div>`;
}

function renderGrid() {
  const items = MENU.filter(p => S.filter==='all' || p.cat===S.filter);
  $('#grid').innerHTML = items.map((p,i)=>`<div class="pc fade-in" style="--i:${i}" data-open="${p.id}">
    <div class="tile"><img src="${img(p.id)}" onerror="this.src='https://via.placeholder.com/118?text=${p.id}'"></div>
    <h3>${p.name}</h3>
    <div class="s">${p.cat}</div>
    <div class="row"><span>${money(p.opts[p.def][1]).split(' ')[0]}</span><button class="addq" data-quick="${p.id}">+</button></div>
  </div>`).join('');
  const cats = [['all','همه'], ['earrings','گوشواره'], ['necklace','گردنبند']];
  $('#pills').innerHTML = cats.map(([k,l])=>`<button data-filter="${k}" class="${S.filter===k?'on':''}">${l}</button>`).join('');
}

function renderDetail() {
  const p = byId(S.sel); if(!p) return;
  const price = p.opts[S.optI][1];
  $('#mDetail').innerHTML = `
   <div class="dstage" id="dstage"><div class="dart" id="dart"><img src="${img(p.id)}" onerror="this.src='https://via.placeholder.com/320?text=${p.id}'"></div></div>
   <div class="hint">‹ برای چرخش بکشید ›</div>
   <div class="dinfo">
     <div class="caps" style="color:var(--teal);font-weight:700">${p.cat.toUpperCase()}</div>
     <h2 class="disp">${p.name}</h2>
     <div class="price" id="dPrice">${money(price)}</div>
     <p>${p.desc}</p>
     <div class="opts" id="dOpts">${p.opts.map((o,i)=>`<button data-opt="${i}" class="${i===S.optI?'on':''}">${o[0]}</button>`).join('')}</div>
     <div class="buy">
       <div class="stepper"><button data-q="-1">-</button><span id="dQty">${S.qty}</span><button data-q="1">+</button></div>
       <button class="btn" data-add>افزودن</button>
     </div>
   </div>
   <div class="strip">${MENU.slice(0,6).map(q=>`<div class="th ${q.id===p.id?'on':''}" data-open="${q.id}"><img src="${img(q.id)}" onerror="this.src='https://via.placeholder.com/46?text=${q.id}'"></div>`).join('')}</div>
  `;
}

function openDetail(id) {
  S.sel = id; S.optI = byId(id).def; S.qty = 1;
  if(S.page !== 'menu') { S.page='menu'; stage.dataset.page='menu'; renderSide(); layers(); }
  renderDetail();
  $('#mGrid').classList.add('hide'); $('#mDetail').classList.remove('hide');
  if(isM()) setTimeout(()=>scroller.scrollTo({top:$('.mpanel').offsetTop-8, behavior:'smooth'}), 60);
}

function addToBag(id, o, q, el) {
  const ex = S.cart.find(i=>i.id===id && i.o===o);
  if(ex) ex.q+=q; else S.cart.push({id, o, q});
  updateBadge(); bump($('#bagBtn')); bump($('#bagBadge'));
  if(el) { const r = sRect(el); burst(r.x+r.w/2, r.y+r.h/2, '✦', 5); }
  toast('به سبد اضافه شد');
}

function renderBag() {
  const n = cartCount(), tot = cartTotal();
  $('#rBag').innerHTML = `<div class="card bagp rise" style="--i:0">
    <div class="hd"><b>سبد خرید</b><em>${n} آیتم</em></div>
    <h2>سبد شما</h2><div class="add" data-go="menu">افزودن ←</div>
    ${n ? `<div class="rows">${S.cart.map((it,i)=>{ const p=byId(it.id), [on,pr]=p.opts[it.o];
      return `<div class="brow fade-in" style="--i:${i}"><div class="t"><img src="${img(p.id)}" onerror="this.src='https://via.placeholder.com/36?text=${p.id}'"></div>
      <div class="n"><b>${p.name}</b><small>${on} · ${money(pr)}</small></div>
      <div class="stepper"><button data-cq="${i}:-1">-</button><span>${it.q}</span><button data-cq="${i}:1">+</button></div>
      <div class="pr">${money(pr*it.q).split(' ')[0]}</div><button class="x" data-rm="${i}">×</button></div>`;
    }).join('')}</div>
    <div class="tot"><div><small>مبلغ کل</small><b>${money(tot)}</b></div><button class="btn" data-checkout>پرداخت ←</button></div>`
    : `<div class="empty">سبد خالی است</div><div class="tot"><div></div><button class="btn" data-go="menu">مشاهده ←</button></div>`}
  </div>`;
}

function checkout() {
  const total = cartTotal();
  S.order = { id: 'NH-' + Math.floor(Math.random()*9000+1000), total, items: S.cart.map(i=>({...i, p: byId(i.id)})) };
  S.cart = []; updateBadge(); renderThanks(); go('thanks');
  S.berries += Math.round(total/1000);
  $('#berryN').textContent = S.berries.toLocaleString('fa-IR');
  setTimeout(()=>burst(560,300,'♥',12), 700);
}

function renderThanks() {
  const o = S.order; if(!o) return;
  $('#rThanks').innerHTML = `<div class="card thanks rise" style="--i:0">
    <div class="tick"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2>سپاسگزاریم!</h2>
    <div class="lead">سفارش شما ثبت شد.<br>به‌زودی با شما تماس می‌گیریم.</div>
    <div class="receipt"><div class="id"><span>کد: ${o.id}</span><span>NAHAL</span></div>
      ${o.items.map(i=>`<div class="li"><span>${i.q} × ${i.p.name}<small>${i.p.opts[i.o][0]}</small></span><span>${money(i.p.opts[i.o][1]*i.q)}</span></div>`).join('')}
      <div class="tt"><span>مجموع</span><b>${money(o.total)}</b></div></div>
    <div class="paid">پرداخت<br>با موفقیت</div>
    <button class="btn" data-go="home">بازگشت ←</button></div>`;
}

function layers() {
  $$('.layer').forEach(l => l.classList.toggle('on', l.dataset.for.split(' ').includes(S.page)));
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go===S.page || (b.dataset.go==='menu' && S.page==='menu')));
  $$('#dockIcons button').forEach(b => b.classList.toggle('on', b.dataset.go===S.page));
}
function go(p) {
  if(p === 'menu' && S.sel) { S.sel = null; $('#mDetail').classList.add('hide'); $('#mGrid').classList.remove('hide'); }
  if(p === 'bag') renderBag();
  if(p === 'menu') renderGrid();
  S.page = p; stage.dataset.page = p;
  renderSide(); layers();
  if(isM()) scroller.scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-quick],[data-filter],[data-opt],[data-q],[data-add],[data-cq],[data-rm],[data-checkout]');
  if(!t) return;
  const d = t.dataset;
  if(d.go) return go(d.go);
  if(d.quick) { e.stopPropagation(); addToBag(d.quick, byId(d.quick).def, 1, t); t.textContent='✓'; t.classList.add('ok'); setTimeout(()=>{t.textContent='+'; t.classList.remove('ok');},1200); return; }
  if(d.open) return openDetail(d.open);
  if(d.filter) { S.filter = d.filter; renderGrid(); return; }
  if(d.opt !== undefined) { S.optI = +d.opt; $$('#dOpts button').forEach((b,i)=>b.classList.toggle('on', i===S.optI)); $('#dPrice').textContent=money(byId(S.sel).opts[S.optI][1]); return; }
  if(d.q) { S.qty = Math.max(1, Math.min(9, S.qty + +d.q)); $('#dQty').textContent = S.qty; return; }
  if('add' in d) { addToBag(S.sel, S.optI, S.qty, t); t.textContent='✓'; t.classList.add('added'); setTimeout(()=>{t.textContent='افزودن'; t.classList.remove('added');},1700); return; }
  if(d.cq) { const [i, dl] = d.cq.split(':').map(Number); S.cart[i].q = Math.max(1, S.cart[i].q+dl); updateBadge(); renderBag(); return; }
  if(d.rm !== undefined) { const row = t.closest('.brow'); row.classList.add('out'); setTimeout(()=>{ S.cart.splice(+d.rm, 1); updateBadge(); renderBag(); }, 250); return; }
  if('checkout' in d) return checkout();
});

$('#berryPill').onclick = e => { toast('امتیاز: ' + S.berries.toLocaleString('fa-IR')); burstAt(e.currentTarget, '✦'); };

let drag=null;
document.addEventListener('pointerdown', e => { const s=e.target.closest('#dstage'); if(!s)return; drag={x:e.clientX}; s.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', e => { if(!drag)return; const dx=(e.clientX-drag.x)/scale; const dart=$('#dart'); if(dart) dart.style.transform=`perspective(800px) rotateY(${dx*0.5}deg)`; });
document.addEventListener('pointerup', () => { drag=null; const dart=$('#dart'); if(dart) dart.style.transform=''; });

(function(){
  const c=$('#petals'); const cols=['#eedcd5','#e0cdc5','#d9c3ba'];
  for(let i=0;i<16;i++){ const p=document.createElement('i'); p.className='petal'; const s=6+Math.random()*8;
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*.8}px;background:${cols[i%3]};animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*24}s`;
    c.appendChild(p); }
})();
